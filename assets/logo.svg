  <circle class="node" cx="58" cy="185" r="7" />
  <circle class="node" cx="198" cy="185" r="7" />

  <circle class="node" cx="128" cy="75" r="8" />
  <circle class="node" cx="105" cy="95" r="7" />
  <circle class="node" cx="151" cy="95" r="7" />
  <circle class="node" cx="92" cy="128" r="8" />
  <circle class="node" cx="164" cy="128" r="8" />
  <circle class="node" cx="105" cy="161" r="7" />
  <circle class="node" cx="151" cy="161" r="7" />
  <circle class="node" cx="128" cy="181" r="8" />

  <circle class="core-ring" cx="128" cy="128" r="24" />
  <circle class="accent" cx="128" cy="128" r="8" />
</svg>
