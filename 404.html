<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Soehl Digital</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root { color-scheme: light; --text:#111318; --muted:#626a76; --line:#e4e8ef; --surface:#f7f8fb; --accent:#2f6fed; }
* { box-sizing: border-box; }
body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #fff; color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.panel { width: min(640px, calc(100% - 40px)); padding: clamp(30px, 6vw, 52px); border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: center; }
h1 { margin: 0 0 10px; font-size: clamp(3rem, 12vw, 6rem); line-height: 1; letter-spacing: -.055em; }
p { margin: 0 0 20px; color: var(--muted); line-height: 1.6; }
a { color: var(--accent); font-weight: 650; text-decoration: none; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main class="panel">
    <h1>404</h1>
    <p>Diese Seite wurde nicht gefunden.</p>
    <a href="/">Zur Startseite</a>
  </main>
</body>
</html>
