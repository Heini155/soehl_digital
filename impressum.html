<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressum - Soehl Digital</title>
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://soehl.digital/impressum.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root { color-scheme: light; --text:#111318; --muted:#626a76; --line:#e4e8ef; --surface:#f7f8fb; --accent:#2f6fed; }
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { width: min(760px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0 96px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 56px; color: var(--text); font-weight: 650; text-decoration: none; }
.brand img { width: 30px; height: 30px; }
h1 { margin: 0 0 28px; font-size: clamp(2.6rem, 8vw, 4.8rem); line-height: .98; letter-spacing: -.055em; }
p { color: var(--muted); font-size: 1.04rem; line-height: 1.7; }
.panel { padding: clamp(26px, 5vw, 42px); border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
</style>
</head>
<body>
<main>
  <a class="brand" href="/">
    <img src="/assets/logo.svg" alt="">
    <span>Soehl Digital</span>
  </a>
  <h1>Impressum</h1>
  <div class="panel">
    <p>
      Diensteanbieter<br><br>
      Soehl Digital<br>
      Heiner Söhl<br>
      Eisenachweg 23<br>
      38527 Meine<br>
      Deutschland
    </p>
    <p>
      Kontakt:<br>
      E-Mail: <a href="mailto:kontakt@soehl.digital">kontakt@soehl.digital</a>
    </p>
    <p>
      Verantwortlich für den Inhalt nach § 18 Abs. 2 MStV:<br>
      Heiner Söhl, Anschrift wie oben
    </p>
    <p><a href="/">Zur Startseite</a></p>
  </div>
</main>
</body>
</html>
